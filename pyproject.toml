[project]
name = "english-speaking-tutor"
version = "0.1.0"
description = "A fully local English speaking tutor and mock interview coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=1.26,<3",
    "openai-whisper>=20240930",
    "requests>=2.31,<3",
    "sentence-transformers>=3,<6",
    "sqlite-vec>=0.1,<1",
    "sounddevice>=0.5,<1",
    "soundfile>=0.12,<1",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
quality = ["jiwer>=3,<5", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
